<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bondhu NGO Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #fdf6ec;
    }

    header {
      background: #1b6e3f;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: 600;
    }

    .container {
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: #f2f2f2;
    }

    .content {
      padding: 15px;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      color: #1b6e3f;
    }

    .date {
      font-size: 12px;
      color: #888;
      margin: 5px 0;
    }

    .about {
      font-size: 14px;
      color: #444;
    }

    .loader, .error, .empty {
      text-align: center;
      margin-top: 40px;
      font-size: 16px;
      color: #777;
    }
  </style>
</head>

<body>

<header>Bondhu NGO - Events Gallery</header>

<div class="container">
  <div id="loader" class="loader">Loading gallery...</div>
  <div id="error" class="error" style="display:none;">Failed to load data</div>
  <div id="empty" class="empty" style="display:none;">No events found</div>
  <div class="gallery" id="gallery"></div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxNT02FzQ4JLiDHjPM2HQUSV4b4lpBmAdugN2RZFxoLyhEZHVWVBjPIKPXw040OaLkD/exec";

  async function loadGallery() {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();

      document.getElementById("loader").style.display = "none";

      if (!data || data.length === 0) {
        document.getElementById("empty").style.display = "block";
        return;
      }

      const gallery = document.getElementById("gallery");

      // ✅ OLD → NEW sorting
      data
        .sort((a, b) => new Date(a.eventDate) - new Date(b.eventDate))
        .forEach(item => {

          const card = document.createElement("div");
          card.className = "card";

          const imageUrl = item.image || "";

          // ✅ Clean date format
          const formattedDate = item.eventDate 
            ? new Date(item.eventDate).toLocaleDateString('en-IN', {
                day: 'numeric',
                month: 'short',
                year: 'numeric'
              })
            : "";

          card.innerHTML = `
            <img src="${imageUrl}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
            <div class="content">
              <div class="title">${item.eventName || "No Title"}</div>
              <div class="date">${formattedDate}</div>
              <div class="about">${item.about || ""}</div>
            </div>
          `;

          gallery.appendChild(card);
        });

    } catch (err) {
      document.getElementById("loader").style.display = "none";
      document.getElementById("error").style.display = "block";
      console.error(err);
    }
  }

  loadGallery();
</script>

</body>
</html>
